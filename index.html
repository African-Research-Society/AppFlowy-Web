<!doctype html>
<html lang="en" translate="no">
<head>
    <meta charset="UTF-8" />
    <script>
      // Paint the workspace in its resolved ground before React or CSS loads.
      (() => {
        const params = new URLSearchParams(window.location.search);
        const theme = params.get('theme');
        let stored = null;
        try { stored = localStorage.getItem('dark-mode'); } catch { /* Storage may be blocked in an iframe. */ }
        const dark = theme === 'dark' || (theme !== 'light' && (
          params.get('ars_embed') === '1' || (stored === null
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : stored === 'true')
        ));
        document.documentElement.setAttribute('data-dark-mode', String(dark));
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = dark ? '#0b0c15' : '#f2ede2';
      })();
    </script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const userAgent = window.navigator.userAgent.toLowerCase();
    const body = document.body;
    const isWin = userAgent.indexOf('win') > -1;
    const isMac = userAgent.indexOf('mac') > -1;
    const isLinux = userAgent.indexOf('linux') > -1;
    const isFirefox = userAgent.indexOf('firefox') > -1;
    const isChrome = userAgent.indexOf('chrome') > -1;
    const isSafari = userAgent.indexOf('safari') > -1;
    if (isWin) {
      body.setAttribute('data-os', 'windows');
    } else if (isMac) {
      body.setAttribute('data-os', 'mac');
    } else if (isLinux) {
      body.setAttribute('data-os', 'linux');
    } else {
      body.setAttribute('data-os', 'unknown');
    }

    if (isFirefox) {
      body.setAttribute('data-browser', 'firefox');
    } else if (isChrome) {
      body.setAttribute('data-browser', 'chrome');
    } else if (isSafari) {
      body.setAttribute('data-browser', 'safari');
    } else {
      body.setAttribute('data-browser', 'unknown');
    }
  });
</script>
